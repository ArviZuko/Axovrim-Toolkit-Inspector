name: Restore original large files with Git LFS
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-lfs-assets.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify released files
        shell: python
        run: |
          import concurrent.futures, hashlib, json, os, pathlib, shutil, subprocess, zipfile
          root = pathlib.Path.cwd()
          config = json.loads("{\"name\":\"Axovrim-Toolkit-Inspector\",\"tag\":\"large-assets-2026-10-19\",\"groups\":[{\"asset\":\"AXOVRIM_Setup.exe\",\"dest\":\"Source Code/Windows/Installer/AXOVRIM_Setup.exe\",\"note\":\"Source Code/Windows/Installer/installer.md\",\"assets\":[{\"name\":\"AXOVRIM_Setup.exe\",\"size\":276821432,\"digest\":\"sha256:2eae14c2dcf28c9826e2703fdd87476a3d193164b69678733a34e68efceb3be9\",\"url\":\"https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/download/large-assets-2026-10-19/AXOVRIM_Setup.exe\"}],\"noteText\":\"# Windows installer\\n\\nDownload [AXOVRIM_Setup.exe](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/download/large-assets-2026-10-19/AXOVRIM_Setup.exe) from the [AXOVRIM large downloads release](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/tag/large-assets-2026-10-19).\\n\\nThe installer executable is 264 MB and is distributed as a Release asset rather than a regular Git file. `AXOVRIM_Setup.iss` is the Inno Setup source used to build it. Use the installer on a supported 64-bit Windows system, with the RealSense camera and USB 3 connection described in the project README.\\n\"},{\"asset\":\"AXOVRIM_Windows_internal.zip\",\"prefix\":\"Source Code/Windows/Application\",\"note\":\"Source Code/Windows/Application/_internal.md\",\"assets\":[{\"name\":\"AXOVRIM_Windows_internal.zip\",\"size\":308095055,\"digest\":\"sha256:ac9ad2707b7b1b0114e1e4285fcab1d4fb288f4e3428764df266676e3dcc174e\",\"url\":\"https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/download/large-assets-2026-10-19/AXOVRIM_Windows_internal.zip\"}],\"noteText\":\"# Packaged Windows runtime\\n\\nDownload [AXOVRIM_Windows_internal.zip](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/download/large-assets-2026-10-19/AXOVRIM_Windows_internal.zip) from the [AXOVRIM large downloads release](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/tag/large-assets-2026-10-19).\\n\\nExtract the archive into this `Application` directory. It contains the `_internal` folder required by the bundled `AXOVRIM.exe`; keep `_internal` beside the executable. The archive is a generated Windows runtime and is distributed separately because it includes files larger than GitHub's regular Git file limit. Alternatively, use the Windows installer or build from `Source Code/Windows/SRC/`.\\n\"},{\"asset\":\"maskrcnn_roboflow_weights.pth\",\"dest\":\"Source Code/Windows/Models/Segmentation/Masked R-CNN/maskrcnn_roboflow_weights.pth\",\"note\":\"Source Code/Windows/Models/Segmentation/Masked R-CNN/README.md\",\"assets\":[{\"name\":\"maskrcnn_roboflow_weights.pth\",\"size\":178146730,\"digest\":\"sha256:79616f6d892a6fbedb69d8e31d1f03ef2bd5c53cea42c7f85ffe0ecb5e257eac\",\"url\":\"https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/download/large-assets-2026-10-19/maskrcnn_roboflow_weights.pth\"}],\"noteText\":\"# Mask R-CNN experiment\\n\\nDownload [maskrcnn_roboflow_weights.pth](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/download/large-assets-2026-10-19/maskrcnn_roboflow_weights.pth) from the [AXOVRIM large downloads release](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/tag/large-assets-2026-10-19) and place it in this folder beside `IS_3000_Masked_Rcnn.ipynb`.\\n\\nThe weight file is about 170 MB and is provided as a Release asset because it exceeds GitHub's regular Git file limit. This folder is a segmentation experiment; the deployed application uses its separately supplied YOLO weight.\\n\"}],\"ignoreRemove\":[\"Source Code/Windows/Application/_internal/\",\"Source Code/Windows/Installer/AXOVRIM_Setup.exe\",\"Source Code/Windows/Models/Segmentation/Masked R-CNN/maskrcnn_roboflow_weights.pth\"],\"originalReadme\":\"# AXOVRIM — AI-Powered Toolkit Inspector\\n\\nAXOVRIM is a desktop and Raspberry Pi 5 inspection system for checking whether an industrial toolkit contains the expected tools and whether sockets meet dimensional references. It combines instance segmentation, RGB-D camera measurements, configurable toolkit layouts, and recorded inspection decisions in one operator workflow.\\n\\n## What makes it distinctive\\n\\n- **Visual inventory and metrology together:** a YOLO segmentation model identifies individual tools and sockets, while depth-assisted geometry estimates socket outer diameters.\\n- **Reference-aware verification:** editable Excel workbooks hold company-specific tool counts and nominal socket measurements; JSON layout and calibration files support spatial matching.\\n- **Traceable decisions:** inspections associate results with a worker and batch, compare expected and observed values, allow audited review/overrides, and export PDF/JSON reports.\\n- **Two deployment targets:** a Windows PyQt5 application and a Raspberry Pi 5 build for edge inspection. The `Models` directories also preserve detection and segmentation experiments for comparison.\\n\\nThis is an inspection aid. Its measurements depend on camera calibration, depth quality, lighting, model performance, and the chosen reference data; verify tolerances against calibrated instruments before production use.\\n\\n## Project layout\\n\\n```text\\nDataset/                       Annotated train/valid/test images and labels\\nDocumentation/                 Final report and presentation\\nScreenshots/                   Main dashboard and inspection/report views\\nSource Code/\\n  Windows/\\n    SRC/                       PyQt5 application, launcher and build scripts\\n    Models/                    Detection and segmentation experiments/weights\\n    Application/               Windows executable and its configuration/assets\\n    Installer/                 Inno Setup source and installer output\\n  Raspberry Pi/                Pi app, setup scripts, model and configuration\\nrequirements.txt              Windows source dependencies\\n```\\n\\nThree large files or file groups are supplied as [Release downloads](https://github.com/ArviZuko/Axovrim-Toolkit-Inspector/releases/tag/large-assets-2026-10-19) rather than regular Git objects: the [Windows installer](Source%20Code/Windows/Installer/installer.md), [packaged Windows runtime](Source%20Code/Windows/Application/_internal.md), and [Mask R-CNN experimental weight](Source%20Code/Windows/Models/Segmentation/Masked%20R-CNN/README.md). The instructions at their original locations contain direct download links. To rebuild a Windows distribution, use `Source Code/Windows/SRC/build_exe.bat` and the installer specification in `Source Code/Windows/Installer/AXOVRIM_Setup.iss`.\\n\\n## Run from source on Windows\\n\\nUse a 64-bit Python environment and an Intel RealSense D455/D455F (or compatible D435-series camera) connected over USB 3. Install dependencies in a virtual environment:\\n\\n```powershell\\ncd \\\"Source Code\\\\Windows\\\\SRC\\\"\\npy -m venv .venv\\n.\\\\.venv\\\\Scripts\\\\Activate.ps1\\npython -m pip install -r ..\\\\..\\\\..\\\\requirements.txt\\npython main.py\\n```\\n\\n`run_app.bat` is an alternative launcher once `.venv` exists in `SRC`. The app looks for its model, Excel reference sheets, configuration, and writable data directories; keep the supplied directory structure intact. If a relative asset path does not resolve in your local setup, launch from the packaged `Application` directory or adjust the configured model paths in `config/model_manifest.json`.\\n\\nFor Raspberry Pi 5, follow [`Source Code/Raspberry Pi/README.md`](Source%20Code/Raspberry%20Pi/README.md), which includes ARM64 setup, system packages, RealSense installation, and `requirements-pi.txt`. Its installer script and `launch_axovrim.sh` are the intended entry points.\\n\\n## Inspection workflow\\n\\n1. Register a worker and choose a company/reference profile.\\n2. Connect and initialize the RealSense camera; capture a toolkit image.\\n3. Review segmented tool counts against `Book1.xlsx` and socket measurements against `Book2.xlsx`.\\n4. Review the PASS, REVIEW, or FAIL decision and any manual override.\\n5. Save the inspection and generate a PDF/JSON batch report.\\n\\nSee the [final report](Documentation/AXOVRIM_Final_Report.docx), [presentation](Documentation/AXOVRIM_Presentation.pptx), [demonstration video](Documentation/AXOVRIM.mp4), and [screenshots](Screenshots/) for the project background and interface. The video is stored with Git LFS; install Git LFS before cloning if you need the full MP4 locally.\\n\\n## Model and data notes\\n\\nThe live application uses a YOLO instance-segmentation weight in its `Models` directory. Other `Source Code/Windows/Models` subfolders contain training notebooks, metrics, result plots, and alternative detection/segmentation weights. The `Dataset` folder contains image/label splits and a `data.yaml`; review its paths and class metadata before starting new training, as the checked-in YAML may need adjustment for your environment.\\n\\nNo accuracy, dimensional tolerance, or certification claim is implied by this repository; consult the included experimental results and validate with your own test set and calibrated hardware.\\n\",\"updatedReadme\":\"# AXOVRIM — AI-Powered Toolkit Inspector\\n\\nAXOVRIM is a desktop and Raspberry Pi 5 inspection system for checking whether an industrial toolkit contains the expected tools and whether sockets meet dimensional references. It combines instance segmentation, RGB-D camera measurements, configurable toolkit layouts, and recorded inspection decisions in one operator workflow.\\n\\n## What makes it distinctive\\n\\n- **Visual inventory and metrology together:** a YOLO segmentation model identifies individual tools and sockets, while depth-assisted geometry estimates socket outer diameters.\\n- **Reference-aware verification:** editable Excel workbooks hold company-specific tool counts and nominal socket measurements; JSON layout and calibration files support spatial matching.\\n- **Traceable decisions:** inspections associate results with a worker and batch, compare expected and observed values, allow audited review/overrides, and export PDF/JSON reports.\\n- **Two deployment targets:** a Windows PyQt5 application and a Raspberry Pi 5 build for edge inspection. The `Models` directories also preserve detection and segmentation experiments for comparison.\\n\\nThis is an inspection aid. Its measurements depend on camera calibration, depth quality, lighting, model performance, and the chosen reference data; verify tolerances against calibrated instruments before production use.\\n\\n## Project layout\\n\\n```text\\nDataset/                       Annotated train/valid/test images and labels\\nDocumentation/                 Final report and presentation\\nScreenshots/                   Main dashboard and inspection/report views\\nSource Code/\\n  Windows/\\n    SRC/                       PyQt5 application, launcher and build scripts\\n    Models/                    Detection and segmentation experiments/weights\\n    Application/               Windows executable and its configuration/assets\\n    Installer/                 Inno Setup source and installer output\\n  Raspberry Pi/                Pi app, setup scripts, model and configuration\\nrequirements.txt              Windows source dependencies\\n```\\n\\nThe [Windows installer](Source%20Code/Windows/Installer/AXOVRIM_Setup.exe), packaged Windows runtime in `Source Code/Windows/Application/_internal/`, and [Mask R-CNN experimental weight](Source%20Code/Windows/Models/Segmentation/Masked%20R-CNN/maskrcnn_roboflow_weights.pth) are stored in their original folders. Large files use Git LFS. Install Git LFS before cloning, then run `git lfs pull` in an existing clone to retrieve the binaries. To rebuild a Windows distribution, use `Source Code/Windows/SRC/build_exe.bat` and `Source Code/Windows/Installer/AXOVRIM_Setup.iss`.\\n\\n## Run from source on Windows\\n\\nUse a 64-bit Python environment and an Intel RealSense D455/D455F (or compatible D435-series camera) connected over USB 3. Install dependencies in a virtual environment:\\n\\n```powershell\\ncd \\\"Source Code\\\\Windows\\\\SRC\\\"\\npy -m venv .venv\\n.\\\\.venv\\\\Scripts\\\\Activate.ps1\\npython -m pip install -r ..\\\\..\\\\..\\\\requirements.txt\\npython main.py\\n```\\n\\n`run_app.bat` is an alternative launcher once `.venv` exists in `SRC`. The app looks for its model, Excel reference sheets, configuration, and writable data directories; keep the supplied directory structure intact. If a relative asset path does not resolve in your local setup, launch from the packaged `Application` directory or adjust the configured model paths in `config/model_manifest.json`.\\n\\nFor Raspberry Pi 5, follow [`Source Code/Raspberry Pi/README.md`](Source%20Code/Raspberry%20Pi/README.md), which includes ARM64 setup, system packages, RealSense installation, and `requirements-pi.txt`. Its installer script and `launch_axovrim.sh` are the intended entry points.\\n\\n## Inspection workflow\\n\\n1. Register a worker and choose a company/reference profile.\\n2. Connect and initialize the RealSense camera; capture a toolkit image.\\n3. Review segmented tool counts against `Book1.xlsx` and socket measurements against `Book2.xlsx`.\\n4. Review the PASS, REVIEW, or FAIL decision and any manual override.\\n5. Save the inspection and generate a PDF/JSON batch report.\\n\\nSee the [final report](Documentation/AXOVRIM_Final_Report.docx), [presentation](Documentation/AXOVRIM_Presentation.pptx), [demonstration video](Documentation/AXOVRIM.mp4), and [screenshots](Screenshots/) for the project background and interface. The video is stored with Git LFS; install Git LFS before cloning if you need the full MP4 locally.\\n\\n## Model and data notes\\n\\nThe live application uses a YOLO instance-segmentation weight in its `Models` directory. Other `Source Code/Windows/Models` subfolders contain training notebooks, metrics, result plots, and alternative detection/segmentation weights. The `Dataset` folder contains image/label splits and a `data.yaml`; review its paths and class metadata before starting new training, as the checked-in YAML may need adjustment for your environment.\\n\\nNo accuracy, dimensional tolerance, or certification claim is implied by this repository; consult the included experimental results and validate with your own test set and calibrated hardware.\\n\",\"workflowPath\":\".github/workflows/restore-lfs-assets.yml\"}")
          temp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "restore-lfs-assets"
          temp.mkdir(exist_ok=True)
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          def digest(path, algorithm="sha256"):
              with open(path, "rb") as stream:
                  return hashlib.file_digest(stream, algorithm).hexdigest()
          def safe_path(name):
              relative = pathlib.PurePosixPath(name.replace("\\", "/"))
              assert not relative.is_absolute() and ".." not in relative.parts and ".git" not in relative.parts, name
              return relative.as_posix()
          assets = {a["name"]: a for g in config["groups"] for a in g["assets"]}
          def download(asset):
              print("Downloading", asset["name"], flush=True)
              target = temp / asset["name"]
              run("curl", "--fail", "--location", "--retry", "5", "--connect-timeout", "30", "--speed-time", "60", "--speed-limit", "1024", "--max-time", "1800", "--silent", "--show-error", "-o", str(target), asset["url"])
              assert target.stat().st_size == asset["size"], asset["name"]
              assert "sha256:" + digest(target) == asset["digest"], asset["name"]
              print("Verified download", asset["name"], flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(download, assets.values()))
          run("git", "lfs", "install", "--local")
          records = {}
          group_skipped = {}
          original_tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"))
          for group in config["groups"]:
              print("Restoring", group["assets"][0]["name"], flush=True)
              skipped = []
              staged_paths = []
              def restore(name, size, stream_factory):
                  name = safe_path(name)
                  if size > 2 * 1024**3:
                      skipped.append({"path": name, "size": size})
                      print("Retained in Releases due to LFS size limit:", name, size, flush=True)
                      return
                  destination = root / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  candidate = temp / "current-file"
                  sha256 = hashlib.sha256()
                  sha1 = hashlib.sha1(("blob " + str(size) + "\0").encode())
                  with stream_factory() as source, open(candidate, "wb") as output:
                      while chunk := source.read(1024 * 1024):
                          output.write(chunk)
                          sha256.update(chunk)
                          sha1.update(chunk)
                  assert candidate.stat().st_size == size, name
                  content_sha256 = sha256.hexdigest()
                  if destination.exists():
                      if destination.stat().st_size < 256 and destination.read_bytes().startswith(b"version https://git-lfs.github.com/spec/v1\n"):
                          pointer = destination.read_text()
                          assert "oid sha256:" + content_sha256 + "\n" in pointer and "\nsize " + str(size) + "\n" in pointer, name
                      else:
                          assert digest(destination) == content_sha256, "Existing file differs: " + name
                  shutil.move(str(candidate), str(destination))
                  lfs = size >= 50 * 1024**2
                  if lfs:
                      run("git", "lfs", "track", "--filename", name)
                      pointer = ("version https://git-lfs.github.com/spec/v1\noid sha256:" + content_sha256 + "\nsize " + str(size) + "\n").encode()
                      expected_blob = hashlib.sha1(("blob " + str(len(pointer)) + "\0").encode() + pointer).hexdigest()
                  else:
                      expected_blob = sha1.hexdigest()
                  records[name] = {"path": name, "size": size, "sha256": content_sha256, "blob": expected_blob, "lfs": lfs, "new": name not in original_tracked}
                  staged_paths.append(name)
              asset_paths = [temp / a["name"] for a in group["assets"]]
              if group.get("dest"):
                  asset = group["assets"][0]
                  restore(group["dest"], asset["size"], lambda: open(asset_paths[0], "rb"))
              else:
                  archive_path = asset_paths[0]
                  if len(asset_paths) > 1:
                      archive_path = temp / "joined.zip"
                      with open(archive_path, "wb") as output:
                          for part in asset_paths:
                              with open(part, "rb") as source:
                                  shutil.copyfileobj(source, output)
                  with zipfile.ZipFile(archive_path) as archive:
                      members = [m for m in archive.infolist() if not m.is_dir()]
                      names = [safe_path(str(pathlib.PurePosixPath(group.get("prefix", "")) / safe_path(m.filename))) for m in members]
                      assert len(names) == len(set(names)), "Repeated archive path"
                      if group.get("expected"):
                          assert set(names) == set(group["expected"]), (names, group["expected"])
                      for member, name in zip(members, names):
                          restore(name, member.file_size, lambda m=member: archive.open(m))
                  if len(asset_paths) > 1:
                      archive_path.unlink()
              for asset_path in asset_paths:
                  asset_path.unlink()
              for offset in range(0, len(staged_paths), 100):
                  run("git", "add", "-f", "--", *staged_paths[offset:offset+100])
              for name in staged_paths:
                  if records[name]["lfs"]:
                      (root / name).unlink()
              note = group.get("note")
              if note:
                  path = root / note
                  assert path.read_text() == group["noteText"], "Download note changed: " + note
                  if skipped:
                      text = path.read_text()
                      addition = "\nFiles within the GitHub LFS size limit are now restored in their original locations. The following originals remain in Releases because they exceed the per-file limit:\n\n" + "\n".join("- " + item["path"] + " (" + str(item["size"]) + " bytes)" for item in skipped) + "\n"
                      path.write_text(text.split("\n",1)[0] + "\n" + addition + "\n" + text.split("\n",1)[1])
                      run("git", "add", "--", note)
                  else:
                      run("git", "rm", "-f", "--", note)
              group_skipped[group["assets"][0]["name"]] = skipped
          ignore = root / ".gitignore"
          if ignore.exists() and config.get("ignoreRemove"):
              lines = ignore.read_text().splitlines()
              ignore.write_text("\n".join(line for line in lines if line not in config["ignoreRemove"]) + "\n")
              run("git", "add", "--", ".gitignore")
          readme = root / "README.md"
          assert readme.read_text() == config["originalReadme"], "Main README changed"
          readme.write_text(config["updatedReadme"])
          run("git", "add", "-f", "--", ".gitattributes", "README.md")
          if config.get("modelsIndex"):
              index_path = root / "Models/README.md"
              assert index_path.read_text() == config["modelsIndex"]["original"]
              skipped_notes = {g["note"] for g in config["groups"] if g.get("note") and group_skipped[g["assets"][0]["name"]]}
              text = "# SAVE model files\n\nRestored model artifacts are stored at their original paths. Files larger than 50 MiB use Git LFS; install Git LFS before cloning and run git lfs pull in an existing clone.\n\n## Files retained in Releases\n\nThe following folder notes describe files that exceed GitHub's LFS per-file size limit:\n\n"
              for note in sorted(skipped_notes):
                  from urllib.parse import quote
                  text += "- [" + note.removeprefix("Models/").removesuffix("/README.md") + "](" + quote(note.removeprefix("Models/")) + ")\n"
              index_path.write_text(text)
              run("git", "add", "--", "Models/README.md")
          index = {}
          for row in subprocess.check_output(["git", "ls-files", "--stage", "-z"]).split(b"\0"):
              if row:
                  metadata, name = row.split(b"\t", 1)
                  index[name.decode()] = metadata.decode().split()[1]
          assert records, "No restored files"
          for name, record in records.items():
              assert index.get(name) == record["blob"], "Staged contents mismatch: " + name
          report = {"restoredFiles": list(records.values()), "retainedInReleases": [item for group in group_skipped.values() for item in group], "newFiles": sum(r["new"] for r in records.values()), "lfsFiles": sum(r["lfs"] for r in records.values())}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Restored " + str(len(records)) + " files (" + str(report["lfsFiles"]) + " using Git LFS). Retained " + str(len(report["retainedInReleases"])) + " oversized originals in Releases.\n\n")
              for item in report["retainedInReleases"]:
                  summary.write("- " + item["path"] + ": " + str(item["size"]) + " bytes\n")
          print("MIGRATION_REPORT " + json.dumps(report), flush=True)
          run("git", "rm", config["workflowPath"])
          run("git", "config", "user.name", "github-actions[bot]")
          run("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          run("git", "commit", "--quiet", "-m", "Restore release-hosted files to their original folders with Git LFS")
          run("git", "push", "origin", "HEAD:main")
          
